name: Tracking integration integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-tracking-integration.mjs index.html
      - run: node --test tests/consent-gtm.test.mjs
