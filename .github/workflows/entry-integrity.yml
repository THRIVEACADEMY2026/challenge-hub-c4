name: Entry authentication integrity
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-entry-assets.mjs
      - run: node --test tests/hub-entry.test.mjs tests/cohort-integration.test.mjs tests/entry-assets.test.mjs
