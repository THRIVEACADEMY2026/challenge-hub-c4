<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Challenge Hub | Book 5 Consults in 5 Days Challenge</title>
<meta name="description" content="Watch each day's session, get today's Quest, and grab your Playbook.">
<link rel="icon" href="https://d2saw6je89goi1.cloudfront.net/uploads/digital_asset/file/664695/THRIVE_FAVICON_CROP_4_FA.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Raleway:wght@200;300;400;500;600&display=swap">

<style>
/* ==========================================================================
   Thrive Challenge Hub

   Type and button specs measured off the live thrive-academy.com, not
   invented. That site is the brand in market:
     Display    Raleway 200, 66-80px, ~1px tracking
     Eyebrow    Oswald 300, letter-spacing 11px, uppercase
     Button     Oswald 400, 16px, letter-spacing 5px, uppercase,
                transparent with a 1px border, 0 radius
   Palette and gradients from Thrive Brand Guidelines 2024.
   Dark grounds are gradient or photographic, never a flat navy fill.
   ========================================================================== */
:root{
  --delft:#1A325C; --cerulean:#016D92; --indigo:#044470;
  --teal:#298EA5;              /* live-site accent */
  --sky:#00AEEF;
  --ink:#1A325C; --body:#5C6570; --soft:#8A939E;
  --line:#E3E7EB; --hair:#EDF0F3;
  --wash-warm:linear-gradient(165deg,#FBFAF6 0%,#FFFFFF 70%);
  /* Taken from the Client Attraction Summit banner: a warm neutral ground with
     navy used as a BAND, never as a field. Sharla's teal against this neutral is
     the contrast that makes the banner work. */
  --ground:#DAD6DA;
  --ground-soft:#E6E3E6;
  --hero-field:
    radial-gradient(105% 95% at 72% 42%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(168deg,#E4E1E4 0%,#DAD6DA 58%,#D2CDD3 100%);
  --grad-gold:linear-gradient(90deg,#9D6903,#FDD276 35%,#875300 55%,#D6B146 78%,#DAB044);
  --gold:#D6B146;
  --ok:#0F7B4F;
}
*{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--body);
  font-family:Raleway,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.7;
  font-weight:400;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.skip{position:absolute;left:-9999px;background:#fff;color:var(--ink);padding:14px 20px;z-index:100}
.skip:focus{left:10px;top:10px}

/* ---------- review tools (delete this whole block before launch) ---------- */
#rev{position:fixed;right:16px;bottom:16px;z-index:70;font-family:Oswald,sans-serif;font-size:10px;
  letter-spacing:2px;text-transform:uppercase;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#revToggle{font:inherit;letter-spacing:2px;background:rgba(255,255,255,.94);color:var(--soft);
  border:1px solid var(--line);padding:9px 13px;cursor:pointer;box-shadow:0 3px 16px rgba(0,24,38,.10)}
#revToggle:hover{color:var(--teal);border-color:var(--teal)}
#revPanel{background:#fff;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,24,38,.16);padding:16px;max-width:250px}
#revPanel[hidden]{display:none}
#revPanel .lbl{display:block;color:var(--soft);margin:0 0 7px}
#revPanel .lbl+.lbl{margin-top:14px}
#revPanel .row{display:flex;flex-wrap:wrap;gap:5px}
#revPanel button{font:inherit;letter-spacing:1px;background:#fff;color:var(--body);border:1px solid var(--line);padding:6px 9px;cursor:pointer}
#revPanel button:hover{border-color:var(--teal);color:var(--teal)}
#revPanel button[aria-pressed=true]{background:var(--indigo);border-color:var(--indigo);color:#fff}
#revPanel .wide{width:100%;margin-top:7px}
#revPanel .note{display:block;text-transform:none;letter-spacing:0;font-family:Raleway,sans-serif;
  font-size:11px;color:var(--soft);line-height:1.5;margin:14px 0 0}

/* ---------- masthead ---------- */
.masthead{position:relative;z-index:20}
.masthead .in{max-width:1180px;margin:0 auto;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.masthead img{width:98px}
.acct{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:Oswald,sans-serif;
  font-weight:300;color:var(--soft);text-align:right;line-height:1.9}
.acct button{background:none;border:0;color:var(--teal);font:inherit;letter-spacing:2px;cursor:pointer;padding:0}
.onDark .acct{color:#6B7681}
.onDark .acct button{color:var(--cerulean)}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--hero-field);color:var(--body);
  overflow:hidden;margin-top:-92px;padding-top:92px;border-bottom:0}
/* the navy band: a device carried straight over from the Summit banner */
.hero .band-strip{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#1A325C;
  padding:17px 28px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:baseline}
.hero .band-strip span{font-family:Oswald,sans-serif;font-weight:400;font-size:14px;
  letter-spacing:4px;text-transform:uppercase;color:#fff;white-space:nowrap}
.hero .band-strip span.hi{color:#00AEEF}
.hero .in{max-width:1180px;margin:0 auto;padding:70px 28px 104px;display:grid;grid-template-columns:1fr;gap:34px;align-items:center;position:relative;z-index:2}
.hero .figure{display:none}
@media (min-width:900px){
  .hero .in{grid-template-columns:1.12fr .88fr;gap:56px;padding:88px 28px 104px;align-items:end}
  .hero .figure{margin-bottom:-104px;position:relative;z-index:4}
  .hero .figure{display:block;justify-self:end;align-self:end;max-width:430px;margin-right:-28px}
  .hero .figure img{width:430px}
}
.hero h1{color:var(--ink)}
.hero p.lede{color:#4A5560;max-width:44ch}
.hero .figure img{filter:drop-shadow(0 24px 44px rgba(26,50,92,.22))}
.hero .small{color:#6B7681}

/* ---------- type ---------- */
h1{font-family:Raleway,sans-serif;font-weight:200;font-size:clamp(36px,5.4vw,66px);line-height:1.08;
  letter-spacing:.5px;color:var(--ink);margin:0 0 20px;text-wrap:balance}
h1 em{font-style:normal;font-weight:400}
h2.sec{font-family:Raleway,sans-serif;font-weight:200;font-size:clamp(28px,3.6vw,46px);line-height:1.12;
  letter-spacing:.5px;color:var(--ink);margin:0 0 18px;text-wrap:balance}
.eyebrow{font-family:Oswald,sans-serif;font-weight:300;font-size:12px;letter-spacing:9px;
  text-transform:uppercase;color:var(--teal);margin:0 0 20px}
.hero .eyebrow{color:var(--cerulean)}
h3.lbl{font-family:Oswald,sans-serif;font-weight:300;font-size:13px;letter-spacing:7px;
  text-transform:uppercase;color:var(--teal);margin:0 0 16px}
p{margin:0 0 18px}
.lede{font-size:clamp(17px,2vw,20px);font-weight:300;line-height:1.65;color:var(--body)}
.small{font-size:14px;line-height:1.65;color:var(--soft)}
.count{font-family:Raleway,sans-serif;font-weight:200;font-size:clamp(40px,7vw,64px);line-height:1;
  letter-spacing:1px;color:var(--ink);font-variant-numeric:tabular-nums;margin:0 0 8px}
.hero .count{color:var(--ink)}
.count-lbl{font-family:Oswald,sans-serif;font-weight:300;font-size:12px;letter-spacing:6px;
  text-transform:uppercase;color:var(--soft);margin:0 0 30px}
.hero .count-lbl{color:#6B7681}

/* ---------- buttons: ghost, wide tracking, square ---------- */
.btn{display:inline-block;font-family:Oswald,sans-serif;font-weight:400;font-size:14px;
  letter-spacing:5px;text-transform:uppercase;padding:16px 30px 16px 35px;border:1px solid var(--ink);
  color:var(--ink);background:transparent;text-decoration:none;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;line-height:1.2;text-align:center}
.btn:hover{background:var(--ink);color:#fff}
.btn-fill{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn-fill:hover{background:#02324F;border-color:#02324F;color:#fff}
.btn-light{border-color:#fff;color:#fff}
.btn-light:hover{background:#fff;color:var(--ink)}
.btn-quiet{border-color:var(--line);color:var(--body)}
.btn-quiet:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn[disabled],.btn.is-locked{border-color:var(--hair);color:#B9C1C9;cursor:not-allowed;background:transparent}
.btn[disabled]:hover,.btn.is-locked:hover{background:transparent;color:#B9C1C9}
.hero .btn{border-color:var(--ink);color:var(--ink);background:transparent}
.hero .btn:hover{background:var(--ink);color:#fff}
.hero .btn-quiet{border-color:rgba(26,50,92,.38);color:#3E4A57}
.hero .btn-quiet:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.hero input[type=email]{color:var(--ink);border-bottom-color:rgba(26,50,92,.45)}
.hero input::placeholder{color:#8B939C}
.hero label.fl{color:#6B7681}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 8px}
.btns .btn{flex:0 0 auto}
@media (max-width:520px){ .btns{flex-direction:column} .btns .btn{width:100%} }

/* ---------- layout bands ---------- */
main{display:block}
.band{max-width:1180px;margin:0 auto;padding:64px 28px}
.band.tight{padding-top:44px}
.band.pale{background:#FAFBFC;max-width:none}
.band.pale > .inner{max-width:1180px;margin:0 auto}
.measure{max-width:62ch}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ---------- day index ---------- */
.days{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.days li{border-bottom:1px solid var(--line)}
.days a,.days span.row{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
  padding:26px 4px;text-decoration:none;color:inherit;transition:padding .2s,background .2s}
.days a:hover{padding-left:14px;background:#FAFBFC}
.days .num{font-family:Raleway,sans-serif;font-weight:200;font-size:34px;line-height:1;color:var(--ink);
  min-width:52px;font-variant-numeric:tabular-nums}
.days .ttl{font-family:Raleway,sans-serif;font-weight:400;font-size:19px;color:var(--ink);line-height:1.35}
.days .sub{display:block;font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:4px;
  text-transform:uppercase;color:var(--soft);margin-top:6px}
.days .meta{font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:4px;
  text-transform:uppercase;color:var(--soft);white-space:nowrap}
.days .meta.live{color:var(--sky)}
.days .meta.done{color:var(--ok)}
.days li.locked .num,.days li.locked .ttl{color:#C2C9D0}
.days li.locked .row{cursor:not-allowed}

/* ---------- progress ---------- */
.prog{display:flex;align-items:center;gap:18px;margin:0 0 6px}
.prog .track{flex:1;height:1px;background:var(--line);position:relative}
.prog .fill{position:absolute;left:0;top:0;height:1px;background:var(--gold);transition:width .4s}
.prog .n{font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:4px;
  text-transform:uppercase;color:var(--soft);white-space:nowrap}

/* ---------- video ---------- */
.video{position:relative;width:100%;aspect-ratio:16/9;background:#ECF1F5;border:1px solid var(--line);padding:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 0 20px}
.video .play{width:74px;height:74px;border:1px solid var(--teal);display:flex;
  align-items:center;justify-content:center;transition:background .2s}
.video .play::after{content:"";width:0;height:0;border-left:17px solid var(--teal);
  border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.video:hover .play{background:rgba(41,142,165,.10)}
.video.playing{background:#000}
.video.playing .play{display:none}

/* ---------- quest steps ---------- */
.steps{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--line)}
.steps li{border-bottom:1px solid var(--line)}
.steps label{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:22px 2px;cursor:pointer}
.steps input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--indigo);cursor:pointer}
.steps .k{display:block;font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:4px;
  text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.steps .t{font-size:17px;font-weight:300;line-height:1.6;color:var(--ink)}
.steps .t b{font-weight:600}
.steps li.on .t{color:var(--soft)}
.steps li.on .k{color:var(--ok)}

/* ---------- ticket ---------- */
.ticket{margin:34px 0 0;padding:30px 0 0;border-top:1px solid var(--line)}
.ticket .gold{width:44px;height:2px;background:var(--grad-gold);margin:0 0 18px}
.ticket p{font-size:17px;font-weight:300;color:var(--ink);max-width:52ch;margin:0}
.ticket b{font-weight:600}

/* ---------- summit ---------- */
.summit{background:var(--wash-warm);color:var(--body);border-top:1px solid var(--line)}
.summit .inner{max-width:1180px;margin:0 auto;padding:76px 28px}
.summit-art{display:block;margin:0 0 34px;max-width:820px;border:1px solid rgba(26,50,92,.10)}
.summit-art img{width:100%;height:auto}
.summit h2.sec{color:var(--ink)}
.summit p{color:var(--body);max-width:52ch}
.summit .eyebrow{color:#9A7B22}
.summit .inner{position:relative}
.summit .inner::before{content:"";display:block;width:52px;height:2px;background:var(--grad-gold);margin:0 0 26px}

/* ---------- concierge ---------- */
.concierge{border-top:1px solid var(--line);padding:40px 0 0;margin:60px 0 0}
.concierge .t{font-family:Raleway,sans-serif;font-weight:400;font-size:18px;color:var(--ink);margin:0 0 10px}
.concierge p{font-size:14px;color:var(--soft);margin:0 0 6px;max-width:56ch}

/* ---------- forms ---------- */
.field{margin:0 0 22px}
label.fl{display:block;font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:5px;
  text-transform:uppercase;color:var(--soft);margin:0 0 10px}
input[type=email],input[type=url]{width:100%;border:0;border-bottom:1px solid var(--ink);padding:12px 0;
  font-family:Raleway,sans-serif;font-weight:300;font-size:19px;color:var(--ink);background:transparent}
input::placeholder{color:#B9C1C9}
input:focus{outline:0;border-bottom-color:var(--teal)}
.msg{border-left:2px solid var(--teal);padding:4px 0 4px 18px;margin:0 0 26px;font-size:15px;
  font-weight:300;color:var(--body);max-width:56ch}
.msg.err{border-left-color:#F16736}
.msg.ok{border-left-color:var(--ok)}
.merge{display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--ink);padding:10px 0;margin:0 0 22px;max-width:440px}
.merge code{font-family:Raleway,sans-serif;font-weight:300;font-size:19px;color:var(--ink)}
.merge button{font-family:Oswald,sans-serif;font-weight:400;font-size:11px;letter-spacing:4px;
  text-transform:uppercase;color:var(--teal);background:none;border:0;cursor:pointer;padding:4px}
.merge button:hover{color:var(--ink)}

.split{display:grid;grid-template-columns:1fr;gap:44px}
@media (min-width:940px){ .split{grid-template-columns:1.45fr .8fr;gap:70px} .split .side{padding-top:6px} }
.aside-blk{margin:0 0 40px}

footer.site{border-top:1px solid var(--line);margin-top:20px}
footer.site .in{max-width:1180px;margin:0 auto;padding:34px 28px;font-family:Oswald,sans-serif;
  font-weight:300;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--soft)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);
  color:#fff;padding:15px 26px;font-family:Oswald,sans-serif;font-weight:300;font-size:12px;letter-spacing:3px;
  text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- narrow screens (kept last so it wins the cascade) ----------
   No figure on mobile, so the field runs top to bottom instead of left to
   right: deep behind the logo and headline, opening to Sharla's cyan at the foot. */
@media (max-width:899px){
  .hero{background:
    radial-gradient(120% 60% at 70% 8%, rgba(255,255,255,.60) 0%, rgba(255,255,255,0) 64%),
    linear-gradient(168deg,#E7E4E7 0%,#DAD6DA 62%,#D0CBD1 100%)}
  .hero .in{padding:52px 24px 92px}
  .hero .band-strip{padding:14px 24px}
  .hero .band-strip span{font-size:12px;letter-spacing:3px}
  .eyebrow{letter-spacing:4px;font-size:11px}
  h3.lbl{letter-spacing:4px;font-size:12px}
  .count-lbl{letter-spacing:4px}
  .band{padding:48px 24px}
  .masthead .in{padding:22px 24px}
  .summit .inner{padding:56px 24px}
}
@media (max-width:560px){
  .eyebrow{letter-spacing:3px}
  .days a,.days span.row{grid-template-columns:auto 1fr;gap:14px;padding:20px 2px}
  .days .meta{grid-column:2;justify-self:start;margin-top:8px}
  .days .num{font-size:26px;min-width:34px}
  .days .ttl{font-size:17px}
  .days .sub{margin-top:5px}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div id="rev">
  <div id="revPanel" hidden>
    <span class="lbl">Day</span>
    <div class="row">
      <button data-day="0">Pre</button><button data-day="1">1</button><button data-day="2">2</button>
      <button data-day="3">3</button><button data-day="4">4</button><button data-day="5">5</button>
    </div>
    <span class="lbl">Session</span>
    <button id="tgLive" class="wide">Before the live</button>
    <button id="tgReset" class="wide">Reset</button>
    <span class="note">Preview only. Delete the review block before launch.</span>
  </div>
  <button id="revToggle" aria-expanded="false" aria-controls="revPanel">Review tools</button>
</div>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

var ZOOM="#zoom-link-to-be-injected"; /* carries an embedded password, never commit it */
var SUMMIT="https://secure.clientattractionsummit.com/order-form-challenge-step-1";
var OPTIN="https://apply.clientattractionsummit.com/challenge-optin-organic-socials";
var FBGROUP="#fb-group-url-needed";
var PB="https://thrive-downloads.s3.us-west-1.amazonaws.com/5DayChallenge/Day+";

var DAYS=[
 {n:1,date:"Monday September 7",short:"Mon Sept 7",title:"Compelling Consult Name",
  asset:"Compelling Consult Name",quest:"day1",post:"https://giftfromthrive.com/day1"},
 {n:2,date:"Tuesday September 8",short:"Tue Sept 8",title:"Create Intrigue",
  asset:"Create Intrigue",quest:"std",post:"https://giftfromthrive.com/day2"},
 {n:3,date:"Wednesday September 9",short:"Wed Sept 9",title:"Trust and Transformation Story",
  asset:"Trust and Transformation Story",quest:"std",post:"https://giftfromthrive.com/day3"},
 {n:4,date:"Thursday September 10",short:"Thu Sept 10",title:"Inspiring Invitation",
  asset:"Inspiring Invitation",quest:"std",post:"https://giftfromthrive.com/day4"},
 {n:5,date:"Friday September 11",short:"Fri Sept 11",title:"Success Story",
  asset:"Success Story or 2nd Inspiring Invitation",quest:"std",post:"https://giftfromthrive.com/day5"}
];
DAYS.forEach(function(d){d.playbook=PB+d.n+"+Quest+Template.pdf";});
var REGISTERED=["sarah@email.com","ella@thrive-academy.com","sj@thrive-academy.com"];

var S={day:2,live:false,email:null,first:null,progress:{}};
try{var r=localStorage.getItem("thriveHubC4");if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem("thriveHubC4",JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/&(?!\w+;)/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cap(e){var n=e.split("@")[0].replace(/[._-]+/g," ").trim();return n.charAt(0).toUpperCase()+n.slice(1);}
function prog(n){return S.progress[n]||(S.progress[n]={steps:[],quest:false});}
function open_(n){return S.day>=n;}
function done_(n){var p=prog(n);return DAYS[n-1].quest==="day1"?p.quest===true:p.steps.length===4;}
function tickets(){return DAYS.filter(function(d){return done_(d.n);}).length;}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},2400);}

function masthead(onDark){
  var acct = S.email
    ? esc(S.email)+'<br><button id="signout">Sign out</button>'
    : 'Not signed in';
  return '<header class="masthead'+(onDark?' onDark':'')+'"><div class="in">'+
    '<a href="#/hub" aria-label="Thrive Academy"><img src="'+'logo-navy.png'+'" alt="Thrive Academy" width="98"></a>'+
    '<div class="acct">'+acct+'</div></div></header>';
}
function concierge(){
  return '<div class="concierge"><p class="t">Your Challenge Concierge is here for you.</p>'+
   '<p>Text (831) 480-1290 or message us at <a href="https://m.me/ThriveAcademy" target="_blank" rel="noopener">m.me/ThriveAcademy</a></p>'+
   '<p>Please include your first and last name so we can find your registration and help you faster.</p></div>';
}
function footer(){return '<footer class="site"><div class="in">&copy; 2026 Thrive Academy</div></footer>';}

    '<form id="loginForm" novalidate style="max-width:560px">'+

      '></div>'+

function vPre(){

  '<div class="band-strip">'+'<span>Starts Monday September 7</span>'+'<span>|</span>'+'<span class="hi">10:00am PT</span>'+'</div>'+'</section>'+

  '<main id="main"><div class="band"><div class="split"><div>'+

      ["Show up for what matters","Introduce yourself","Invite a friend","Stay engaged"].map(function(t,i){
      return '<li><span class="row" style="grid-template-columns:auto 1fr;padding:18px 0"><span class="num" style="font-size:22px;min-width:34px">'+(i+1)+'</span>'+
             '<span class="ttl" style="font-size:16px">'+t+'</span></span></li>';}).join('')+

function vHub(){
  var t=tickets(), tot=DAYS.filter(function(d){return open_(d.n);}).length;
  var rows=DAYS.map(function(d){
    if(!open_(d.n)) return '<li class="locked"><span class="row"><span class="num">'+d.n+'</span>'+
      '<span><span class="ttl">Day '+d.n+'</span><span class="sub">'+esc(d.short)+'</span></span>'+
      '<span class="meta">Opens 10am PT</span></span></li>';
    var live=(S.day===d.n&&!S.live), dn=done_(d.n);
    return '<li><a href="#/day/'+d.n+'"><span class="num">'+d.n+'</span>'+
      '<span><span class="ttl">'+d.title+'</span><span class="sub">'+esc(d.short)+'</span></span>'+
      '<span class="meta'+(live?' live':'')+(dn?' done':'')+'">'+(live?'Live now':(dn?'Complete':'Open'))+'</span></a></li>';
  }).join('');

  return masthead(true)+
  '<section class="hero"><div class="in"><div>'+
    '<p class="eyebrow">Book 5 Consults in 5 Days</p>'+
    '<h1>Welcome back,<br><em>'+esc(S.first)+'</em></h1>'+
    (t>0
      ? '<p class="count">'+t+'</p><p class="count-lbl">Golden Ticket'+(t===1?"":"s")+' earned</p>'
      : '')+
    '<p class="lede">'+(t>0?'Everything you need is here. Pick up where you left off.'
      :'Everything you need is here. Complete a day\'s Quest to earn your first Golden Ticket.')+'</p>'+
  '</div><div class="figure"><img src="sharla-cutout.png" alt="Sharla Jacobs" width="390"></div></div>'+
  '<div class="band-strip">'+'<span>September 7 to 11</span>'+'<span>|</span>'+'<span class="hi">Live daily 10:00am PT</span>'+'</div>'+'</section>'+

  '<main id="main"><div class="band">'+
    '<h3 class="lbl">Your five days</h3>'+
    '<div class="prog"><span class="n">'+t+' of '+tot+'</span>'+
      '<span class="track"><span class="fill" style="width:'+(tot?Math.round(t/tot*100):0)+'%"></span></span></div>'+
    '<ul class="days">'+rows+'</ul>'+
    '<div class="btns" style="margin-top:38px"><a class="btn btn-quiet" href="#/prechallenge">Pre-Challenge Quests</a></div>'+
    concierge()+
  '</div>'+
  '<section class="summit"><div class="inner">'+
    '<a class="summit-art" href="'+SUMMIT+'" target="_blank" rel="noopener">'+
      '<img src="summit-banner.jpg" alt="Client Attraction Summit, September 18 to 20, online" width="1800" height="790" loading="lazy">'+
    '</a>'+
    '<h2 class="sec">Go further than five days</h2>'+
    '<p class="lede">Three days with Sharla and Jesse, live, building the client attraction system behind everything you are learning this week.</p>'+
    '<div class="btns"><a class="btn" href="'+SUMMIT+'" target="_blank" rel="noopener">Save my seat</a></div>'+
  '</div></section></main>'+footer();
}

function questBlock(d){
  var p=prog(d.n), items;
  if(d.quest==="day1"){
    items='<li class="'+(p.quest?'on':'')+'"><label><input type="checkbox" id="q1"'+(p.quest?' checked':'')+'>'+
      '<span><span class="k">Day 1 Quest</span><span class="t">I posted my <b>Compelling Consult Name</b> on the Quest post.</span></span></label></li>';
  }else{
    var L=['Encourage <b>5 or more Champions</b> by liking and commenting on their posts.',
           'Post your <b>'+d.asset+'</b> on Facebook, Instagram, or LinkedIn.',
           'Share your post link in the <b>Day '+d.n+' Quest</b> comments.',
           'Comment on <b>5 or more Champions</b> to help boost each other.'];
    items=L.map(function(t,i){var on=p.steps.indexOf(i)>-1;
      return '<li class="'+(on?'on':'')+'"><label><input type="checkbox" data-step="'+i+'"'+(on?' checked':'')+'>'+
        '<span><span class="k">Step '+(i+1)+'</span><span class="t">'+t+'</span></span></label></li>';}).join('');
  }
  return '<h3 class="lbl">Today\'s Quest</h3>'+
    '<h2 class="sec">'+(d.quest==="day1"?'Name your consult':'Post your '+d.asset)+'</h2>'+
    '<div class="btns"><a class="btn btn-fill" href="'+d.post+'" target="_blank" rel="noopener">Open the Quest post</a></div>'+
    '<ul class="steps">'+items+'</ul>';
}

function vDay(n){
  var d=DAYS[n-1]; if(!d) return vHub();
  if(!open_(n)){
    return masthead(false)+'<main id="main"><div class="band"><p class="eyebrow">Day '+n+'</p>'+
      '<h1>Not open yet</h1><p class="lede measure">Day '+n+' opens '+esc(d.short)+' at 10:00am PT. We will email you the moment it does.</p>'+
      '<div class="btns"><a class="btn btn-quiet" href="#/hub">Back to my Hub</a></div>'+concierge()+'</div></main>'+footer();
  }
  var before=(S.day===n&&!S.live), dn=done_(n);

  var media = before
   ? '<p class="count" id="cd">02:14:36</p><p class="count-lbl">Until we go live, 10:00am PT</p>'+
     '<div class="btns"><a class="btn btn-fill" href="'+ZOOM+'" id="joinZoom" target="_blank" rel="noopener">Join the live session</a></div>'
   : '<button class="video" id="vid" aria-label="Play the Day '+n+' session"><span class="play"></span></button>';

  var quest = before
   ? '<h3 class="lbl">Today\'s Quest</h3><h2 class="sec">Unlocks when we go live</h2>'+
     '<p class="lede measure">Stay with me on the call and you will have it written before we finish.</p>'
   : questBlock(d);

  var ticket = before ? '' :
   '<div class="ticket"><div class="gold"></div><p>'+
   (dn?'<b>Golden Ticket earned.</b> That is Day '+n+' complete. You are in the draw for the Client Attraction Summit and two months in Platinum.'
      :'Complete every step to earn <b>one Golden Ticket</b> toward the Client Attraction Summit and two months in Platinum.')+
   '</p><p class="small" style="margin-top:18px">Not on Facebook? <a href="#/submit/'+n+'">Submit your post here instead.</a></p></div>';

  return masthead(false)+
  '<main id="main"><div class="band"><div class="split"><div>'+
    '<p class="eyebrow">Day '+n+' &middot; '+esc(d.date)+'</p>'+
    '<h1>'+d.title+'</h1>'+
    media+quest+ticket+concierge()+
  '</div><div class="side">'+
    '<div class="aside-blk"><h3 class="lbl">Playbook</h3>'+
      '<p class="small" style="margin-bottom:22px">Follow along on the call and write your '+d.asset+' as we go.</p>'+
      '<div class="btns"><a class="btn btn-quiet" href="'+d.playbook+'" target="_blank" rel="noopener">Download</a></div></div>'+
    '<div class="aside-blk"><h3 class="lbl">All days</h3><ul class="days" style="border-top:1px solid var(--line)">'+
      DAYS.map(function(x){
        if(!open_(x.n)) return '<li class="locked"><span class="row" style="grid-template-columns:auto 1fr;padding:15px 0"><span class="num" style="font-size:20px;min-width:30px">'+x.n+'</span><span class="ttl" style="font-size:15px">Day '+x.n+'</span></span></li>';
        return '<li><a href="#/day/'+x.n+'" style="grid-template-columns:auto 1fr;padding:15px 0"><span class="num" style="font-size:20px;min-width:30px">'+x.n+'</span><span class="ttl" style="font-size:15px">'+(x.n===n?'<b>'+x.title+'</b>':x.title)+'</span></a></li>';
      }).join('')+'</ul></div>'+
  '</div></div></div>'+
  '<section class="summit"><div class="inner">'+
    '<a class="summit-art" href="'+SUMMIT+'" target="_blank" rel="noopener">'+
      '<img src="summit-banner.jpg" alt="Client Attraction Summit, September 18 to 20, online" width="1800" height="790" loading="lazy">'+
    '</a>'+
    '<h2 class="sec">Go further than five days</h2>'+
    '<p class="lede">Three days with Sharla and Jesse, live, building the client attraction system behind everything you are learning this week.</p>'+
    '<div class="btns"><a class="btn" href="'+SUMMIT+'" target="_blank" rel="noopener">Save my seat</a></div>'+
  '</div></section></main>'+footer();
}

function vSubmit(n,sent){
  var d=DAYS[n-1];
  if(sent) return masthead(false)+'<main id="main"><div class="band measure">'+
    '<p class="eyebrow">Day '+n+'</p><h1>Counted</h1>'+
    '<div class="msg ok">Your Day '+n+' Quest is counted. See you tomorrow at 10:00am PT.</div>'+
    '<div class="btns"><a class="btn" href="#/hub">Back to my Hub</a></div>'+concierge()+'</div></main>'+footer();
  return masthead(false)+'<main id="main"><div class="band measure">'+
    '<p class="eyebrow">Day '+n+' &middot; '+esc(d.date)+'</p><h1>Submit your Quest</h1>'+
    '<p class="lede">Posted somewhere other than our Facebook Group? Drop the link here and we will count it toward your Golden Ticket.</p>'+
    '<form id="subForm" novalidate>'+
      '<div class="field"><label class="fl" for="se">Your email</label><input type="email" id="se" value="'+esc(S.email||"")+'" required></div>'+
      '<div class="field"><label class="fl" for="su">Link to your post</label><input type="url" id="su" placeholder="https://" required></div>'+
      '<div class="btns"><button class="btn btn-fill" type="submit">Count my Quest</button>'+
      '<a class="btn btn-quiet" href="#/day/'+n+'">Back</a></div>'+
    '</form>'+concierge()+'</div></main>'+footer();
}

/* ---------------- router ---------------- */
function render(keep){
  var y=window.scrollY,h=location.hash||"#/login",html,m;
  if(!S.email&&h!=="#/login"){location.hash="#/login";return;}
  if(h==="#/login")html=vLogin(false);
  else if(h==="#/prechallenge")html=vPre();
  else if(h==="#/hub")html=vHub();
  else if((m=h.match(/^#\/day\/([1-5])$/)))html=vDay(+m[1]);
  else if((m=h.match(/^#\/submit\/([1-5])$/)))html=vSubmit(+m[1],false);
  else{location.hash=S.day>=1?"#/hub":"#/prechallenge";return;}
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,keep?y:0);
  wire();syncRev();
}

function wire(){
  var q=function(i){return document.getElementById(i);};
  var so=q("signout");if(so)so.onclick=function(){S.email=null;S.first=null;save();location.hash="#/login";render();};

  var lf=q("loginForm");
  if(lf)lf.onsubmit=function(e){e.preventDefault();
    var v=(q("em").value||"").trim().toLowerCase();
    if(REGISTERED.indexOf(v)>-1){S.email=v;S.first=cap(v);save();location.hash=S.day>=1?"#/hub":"#/prechallenge";render();}
    else{document.getElementById("app").innerHTML=vLogin(true);wire();q("em").value=v;q("em").focus();}};
  var mg=q("magic");
  if(mg)mg.onclick=function(e){e.preventDefault();S.email=REGISTERED[0];S.first=cap(REGISTERED[0]);save();
    toast("Signed in from your magic link");location.hash=S.day>=1?"#/hub":"#/prechallenge";render();};

  var ce=q("copyEmail");
  if(ce)ce.onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(S.email).then(function(){toast("Email copied");},function(){toast(S.email);});
    else toast(S.email);};
  var ac=q("addCal");if(ac)ac.onclick=function(){toast("Calendar events added");};
  var jf=q("joinFb");if(jf)jf.onclick=function(e){e.preventDefault();toast("Facebook Group link still to be supplied");};
  var jz=q("joinZoom");if(jz&&ZOOM.charAt(0)==="#")jz.onclick=function(e){e.preventDefault();toast("Zoom link is injected in the production build");};
  var v=q("vid");if(v)v.onclick=function(){v.classList.toggle("playing");toast(v.classList.contains("playing")?"Playing":"Paused");};

  var m=location.hash.match(/^#\/day\/([1-5])$/);
  if(m){
    var n=+m[1],p=prog(n),q1=q("q1");
    if(q1)q1.onchange=function(){p.quest=q1.checked;save();render(true);if(p.quest)toast("Golden Ticket earned");};
    Array.prototype.forEach.call(document.querySelectorAll("[data-step]"),function(cb){
      cb.onchange=function(){var i=+cb.getAttribute("data-step"),k=p.steps.indexOf(i);
        if(cb.checked&&k<0)p.steps.push(i);
        if(!cb.checked&&k>-1)p.steps.splice(k,1);
        save();var now=done_(n);render(true);if(now)toast("Golden Ticket earned");};});
    var cd=q("cd");
    if(cd){var t=8076;clearInterval(window._cd);
      window._cd=setInterval(function(){
        if(!document.body.contains(cd)){clearInterval(window._cd);return;}
        if(t>0)t--;var z=function(x){return String(x).padStart(2,"0");};
        cd.textContent=z(Math.floor(t/3600))+":"+z(Math.floor(t%3600/60))+":"+z(t%60);},1000);}
  }

  var sf=q("subForm");
  if(sf)sf.onsubmit=function(e){e.preventDefault();
    var n=+location.hash.match(/^#\/submit\/([1-5])$/)[1],p=prog(n);
    if(DAYS[n-1].quest==="day1")p.quest=true;else p.steps=[0,1,2,3];
    save();document.getElementById("app").innerHTML=vSubmit(n,true);wire();};
}

/* ---------------- review tools ---------------- */
function syncRev(){
  Array.prototype.forEach.call(document.querySelectorAll("#rev [data-day]"),function(b){
    b.setAttribute("aria-pressed",(+b.getAttribute("data-day"))===S.day?"true":"false");});
  var t=document.getElementById("tgLive");
  t.setAttribute("aria-pressed",S.live?"true":"false");
  t.textContent=S.live?"After the live":"Before the live";
}
Array.prototype.forEach.call(document.querySelectorAll("#rev [data-day]"),function(b){
  b.onclick=function(){S.day=+b.getAttribute("data-day");save();
    var m=location.hash.match(/^#\/day\/([1-5])$/);
    if(S.day===0)location.hash="#/prechallenge";
    else if(m&&+m[1]>S.day)location.hash="#/hub";
    render();};});
document.getElementById("tgLive").onclick=function(){S.live=!S.live;save();render();};
document.getElementById("tgReset").onclick=function(){
  S={day:2,live:false,email:null,first:null,progress:{}};save();location.hash="#/login";render();toast("Reset");};
var rt=document.getElementById("revToggle"),rp=document.getElementById("revPanel");
rt.onclick=function(){var op=rp.hasAttribute("hidden");
  if(op)rp.removeAttribute("hidden");else rp.setAttribute("hidden","");
  rt.setAttribute("aria-expanded",op?"true":"false");
  rt.textContent=op?"Hide":"Review tools";};

window.addEventListener("hashchange",function(){render();});
render();
})();
</script>
