<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Setting up your Challenge Hub | Thrive Academy</title>
<link rel="icon" href="https://d2saw6je89goi1.cloudfront.net/uploads/digital_asset/file/664695/THRIVE_FAVICON_CROP_4_FA.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&family=Raleway:wght@200;300;400;500;600&display=swap">
<style>
:root{--ink:#1A325C;--teal:#298EA5;--body:#5C6570;--soft:#8A939E;--ground:#DAD6DA;--line:#E3E7EB;--btn:#F3771A;--btn-hover:#DA6710}
*{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:linear-gradient(168deg,#ECEAEC 0%,var(--ground) 100%);color:var(--body);font-family:Raleway,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid #019ACD;outline-offset:2px}
.masthead{padding:18px 20px}
.masthead img{display:block;width:102px;height:auto}
.entry{min-height:calc(100vh - 96px);display:grid;place-items:center;padding:48px 22px 96px}
.card{width:min(100%,620px);background:#fff;border-top:4px solid var(--ink);box-shadow:0 18px 60px rgba(26,50,92,.13);padding:clamp(34px,6vw,62px);text-align:center}
.eyebrow{margin:0 0 14px;color:var(--teal);font-family:Oswald,Impact,sans-serif;font-size:12px;font-weight:300;letter-spacing:.42em;text-transform:uppercase}
h1{margin:0 0 18px;color:var(--ink);font-size:clamp(31px,5vw,46px);font-weight:200;line-height:1.08;text-wrap:balance}
p{margin:0 auto 24px;max-width:44ch}
.pulse{width:38px;height:38px;margin:30px auto;border:3px solid #DDE4EA;border-top-color:var(--teal);border-radius:50%;animation:spin .9s linear infinite}
.signin{margin:24px auto 0;max-width:390px;text-align:left}.signin label{display:block;margin-bottom:6px}.signin input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);margin-bottom:12px}.signin .btn{width:100%}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.btn{display:inline-block;min-width:180px;padding:14px 20px;border:1px solid var(--btn);background:var(--btn);color:#fff;font-family:Oswald,Impact,sans-serif;font-size:13px;font-weight:400;letter-spacing:.28em;text-decoration:none;text-transform:uppercase;cursor:pointer}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn-secondary{background:var(--ink);border-color:var(--ink)}
.btn-secondary:hover{background:#102442;border-color:#102442}
[hidden]{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;border-color:var(--teal)}}
@media (max-width:520px){.entry{padding:24px 16px 64px}.card{padding:34px 24px}.signin{margin:24px auto 0;max-width:390px;text-align:left}.signin label{display:block;margin-bottom:6px}.signin input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);margin-bottom:12px}.signin .btn{width:100%}.actions{display:grid}.btn{width:100%}}
</style>
</head>
<body>
<header class="masthead">
  <img src="../logo-navy.png" alt="Thrive Academy">
</header>
<main class="entry">
  <section class="card" aria-live="polite" aria-busy="false">
    <p class="eyebrow">Book 5 Consults in 5 Days Challenge</p>
    <h1 id="entryTitle">Setting up your Challenge Hub...</h1>
    <p id="entryMessage">We&rsquo;re checking your access. If this page does not continue, use the link below or your registration confirmation email.</p>
    <div id="entryPulse" class="pulse" hidden aria-hidden="true"></div>
    <form id="entrySignIn" class="signin" hidden>
      <label for="entryEmail">Email used for your Challenge registration</label>
      <input id="entryEmail" name="email" type="email" autocomplete="email" required maxlength="320">
      <button id="entrySubmit" class="btn" type="submit">Continue to my Hub</button>
      <p id="entrySignInMessage" role="status" style="margin-top:12px"></p>
    </form>
    <div id="entryActions" class="actions">
      <button id="entryRetry" class="btn" type="button">Retry</button>
      <a class="btn btn-secondary" href="/">Go to Hub sign in</a>
    </div>
  </section>
</main>
<noscript><p style="text-align:center">JavaScript is needed for automatic entry. Use the Hub sign-in link above or your confirmation email.</p></noscript>
<script src="./handoff.js?v=entry-incident-12-c482b2cc"></script>
</body>
</html>
